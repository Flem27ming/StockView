<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mine Udvalgte Live Aktier</title>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-advanced-chart.js"></script>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"></script>
    <style>
        /* Sætter en flot, mørk baggrund og fjerner scrollbars */
        body {
            margin: 0;
            padding: 20px;
            background-color: #0b0e14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* Grid-system der automatisk fordeler kasserne pænt ud på skærmen */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1600px;
        }
        /* Designet af de store farvede firkanter */
        .box {
            padding: 50px 20px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: background-color 0.4s ease, transform 0.2s;
        }

            .box:hover {
                transform: scale(1.02);
            }
        /* Farver baseret på markedsretning */
        .neutral {
            background-color: #1f242e;
        }

        .up {
            background-color: #0f7a3e;
        }
        /* Lysende Grøn */
        .down {
            background-color: #b71c1c;
        }
        /* Lysende Rød */

        /* Tekststørrelser i kasserne */
        .ticker {
            font-size: 3.5rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .price {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .percent {
            font-size: 1.8rem;
            opacity: 0.95;
            background: rgba(0,0,0,0.15);
            padding: 4px 12px;
            display: inline-block;
        }

        .wrap {
            width: 100%;
            max-width: 1600px;
        }

        .status {
            margin-top: 18px;
            text-align: center;
            font-size: 0.95rem;
            color: #8b93a7;
        }

            .status.fejl {
                color: #ffb74d;
            }

        .box {
            cursor: pointer;
        }

        /* Detaljevisning: den valgte aktie øverst, grafen under */
        body.detalje {
            align-items: flex-start;
        }

        #detalje {
            display: none;
        }

        body.detalje #detalje {
            display: block;
        }

        body.detalje #dashboard,
        body.detalje #tape {
            display: none;
        }

        /* Kursbånd nederst på forsiden */
        #tape {
            margin-top: 20px;
        }

            #tape tv-ticker-tape {
                display: block;
                width: 100%;
            }

        .tilbage {
            display: block;
            margin-bottom: 15px;
            padding: 12px 22px;
            background: #1f242e;
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        #detaljeBoks .box {
            cursor: default;
        }

            #detaljeBoks .box:hover {
                transform: none;
            }

        #graf {
            margin-top: 20px;
            height: 70vh;
            min-height: 400px;
        }

            #graf tv-advanced-chart {
                display: block;
                width: 100%;
                height: 100%;
            }
    </style>
</head>
<body>

    <div class="wrap">
        <div class="grid" id="dashboard"></div>
        <div id="detalje">
            <button class="tilbage" id="tilbage">&larr; Tilbage</button>
            <div id="detaljeBoks"></div>
            <div id="graf"></div>
        </div>
        <div id="tape"></div>
        <div class="status" id="status">Henter live-data fra markedet...</div>
    </div>

    <script>// Dine valgte aktier til skærm nummer to
        const mineAktier = ['HELP', 'CMPS', 'MARA', 'MRNA', 'SMMT', 'ORKA', 'AMD'];

        // Dit Cloudflare-link (bruges på telefonen / GitHub Pages). Indsæt det mellem anførselstegnene.
        const CLOUDFLARE_URL = 'https://stockview.flem27ming.workers.dev';

        // 1) Cloudflare-relæet henter kurserne fra nasdaq.com - virker overalt, også på telefonen.
        // 2) Den lokale StockView-server (start.bat) - kun når siden åbnes på denne computer.
        // 3) Gratis CORS-proxyer som sidste udvej (kan være langsomme eller nede).
        const paaComputeren = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
        const lokalServer = location.port === '8765' ? '' : 'http://localhost:8765';
        const proxyer = [
            url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
            url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
        ];
        const senesteKurser = {};   // beholder sidste kendte kurs, så kasserne ikke blinker tilbage
        let senestOpdateret = null;
        let kilde = '';
        let igang = false;

        function hentMedTimeout(url, ms) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            return fetch(url, { signal: ctrl.signal, cache: 'no-store' }).finally(() => clearTimeout(t));
        }

        async function fraRelae(url, navn) {
            const res = await hentMedTimeout(url, 8000);
            if (!res.ok) throw new Error(navn + ' ' + res.status);
            const liste = (await res.json()).filter(q => q.price != null);
            if (!liste.length) throw new Error(navn + ': ingen data');
            liste.forEach(q => { senesteKurser[q.symbol] = q; });
            kilde = navn + (liste[0].source ? ` (${liste[0].source})` : '');
        }

        async function fraCloudflare() {
            if (!CLOUDFLARE_URL) throw new Error('intet Cloudflare-link');
            await fraRelae(`${CLOUDFLARE_URL.replace(/\/$/, '')}/?symbols=${mineAktier.join(',')}`, 'Cloudflare');
        }

        async function fraLokalServer() {
            if (!paaComputeren) throw new Error('ikke på computeren');
            await fraRelae(`${lokalServer}/api/quotes?symbols=${mineAktier.join(',')}`, 'lokal server');
        }

        async function fraProxy(ticker) {
            const yahoo = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?range=1d&interval=1m`;
            for (const proxy of proxyer) {
                try {
                    const res = await hentMedTimeout(proxy(yahoo), 10000);
                    const meta = (await res.json()).chart.result[0].meta;
                    return { symbol: ticker, price: meta.regularMarketPrice,
                             previousClose: meta.previousClose ?? meta.chartPreviousClose };
                } catch (e) { /* prøv næste proxy */ }
            }
            throw new Error('ingen proxy svarede');
        }

        async function fraProxyer() {
            const svar = await Promise.allSettled(mineAktier.map(fraProxy));
            svar.forEach(s => { if (s.status === 'fulfilled') senesteKurser[s.value.symbol] = s.value; });
            if (!svar.some(s => s.status === 'fulfilled')) throw new Error('ingen data');
            kilde = 'offentlig proxy';
        }

        // Børs til TradingView-grafen (alle er på NASDAQ - tilføj her, hvis en aktie ligger et andet sted, fx 'XYZ': 'NYSE')
        const boers = {};
        let valgtAktie = null;

        // Kursbåndet nederst viser dine aktier + ekstra symboler
        const ekstraIBaand = ['FX:EURUSD', 'TVC:GOLD'];
        const baand = document.createElement('tv-ticker-tape');
        baand.setAttribute('symbols', mineAktier.map(t => `${boers[t] || 'NASDAQ'}:${t}`).concat(ekstraIBaand).join(','));
        baand.setAttribute('theme', 'dark');
        document.getElementById('tape').appendChild(baand);

        function boks(ticker) {
            const q = senesteKurser[ticker];
            if (!q) {
                return `<div class="box neutral" data-ticker="${ticker}"><div class="ticker">${ticker}</div>
                        <div class="price">Henter data...</div><div class="percent">Live</div></div>`;
            }
            const procent = q.previousClose ? ((q.price - q.previousClose) / q.previousClose) * 100 : 0;
            const klasse = procent > 0 ? 'up' : procent < 0 ? 'down' : 'neutral';
            return `<div class="box ${klasse}" data-ticker="${ticker}"><div class="ticker">${ticker}</div>
                    <div class="price">$${q.price.toFixed(3)}</div>
                    <div class="percent">${procent >= 0 ? '+' : ''}${procent.toFixed(2)}%</div></div>`;
        }

        function tegn() {
            document.getElementById('dashboard').innerHTML = mineAktier.map(boks).join('');
            if (valgtAktie) document.getElementById('detaljeBoks').innerHTML = boks(valgtAktie);
        }

        function aabnAktie(ticker) {
            valgtAktie = ticker;
            const graf = document.createElement('tv-advanced-chart');
            graf.setAttribute('symbol', `${boers[ticker] || 'NASDAQ'}:${ticker}`);
            graf.setAttribute('interval', '60');
            graf.setAttribute('hide-volume', '');
            graf.setAttribute('theme', 'dark');
            graf.setAttribute('studies', '["STD;RSI"]');
            document.getElementById('graf').replaceChildren(graf);
            document.body.classList.add('detalje');
            tegn();
            window.scrollTo(0, 0);
        }

        function lukAktie() {
            valgtAktie = null;
            document.body.classList.remove('detalje');
            document.getElementById('graf').replaceChildren();
        }

        document.getElementById('dashboard').addEventListener('click', e => {
            const b = e.target.closest('.box');
            if (!b) return;
            history.pushState({ aktie: b.dataset.ticker }, '');   // så telefonens tilbage-knap også virker
            aabnAktie(b.dataset.ticker);
        });
        document.getElementById('tilbage').addEventListener('click', () => {
            if (history.state && history.state.aktie) history.back(); else lukAktie();
        });
        window.addEventListener('popstate', e => {
            if (e.state && e.state.aktie) aabnAktie(e.state.aktie); else lukAktie();
        });

        async function hentKurser() {
            if (igang) return;   // undgå at kald hober sig op, hvis et svar er langsomt
            igang = true;
            const status = document.getElementById('status');
            try {
                try { await fraCloudflare(); }
                catch (e1) { try { await fraLokalServer(); } catch (e2) { await fraProxyer(); } }
                senestOpdateret = new Date();
                status.textContent = `Live · opdateret ${senestOpdateret.toLocaleTimeString('da-DK')} · kilde: ${kilde}`;
                status.className = 'status';
            } catch (e) {
                status.textContent = (senestOpdateret
                    ? `Kunne ikke opdatere – viser kurser fra ${senestOpdateret.toLocaleTimeString('da-DK')}. `
                    : 'Kan ikke hente kurser. ') + (CLOUDFLARE_URL
                        ? 'Cloudflare-relæet svarer ikke.'
                        : 'Indsæt dit Cloudflare-link i CLOUDFLARE_URL i index.html.');
                status.className = 'status fejl';
            }
            tegn();
            igang = false;
        }

        // Starter med det samme og opdaterer automatisk hvert 5. sekund
        tegn();
        hentKurser();
        setInterval(hentKurser, 5000);</script>
</body>
</html>
